
<!DOCTYPE html>
<html lang="pt-br">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>titulo</title>
	<style>
		body {
			font-family: Arial narrow, sans-serif;
			margin: 2px;
			padding: 2px;
			background-color: #f4f4f4;
			color: #333;
		}
		.container{
			max-width:900px; 
			margin:20px auto; 
			padding:20px;
		}
		header {
			background-color: gray;
			color: white;
			padding: 20px 0;
			text-align: center;
		}
		main {
			padding: 20px;
			max-width: 900px;
			margin: auto;
			background-color: white;
			box-shadow: 0 0 10px rgba(0,0,0,0.1);
		}
		footer {
			background-color: #0066cc;
			color: white;
			text-align: center;
			padding: 15px 0;
			margin-top: 40px;
		}

		@keyframes spin{
			from{transform:rotate(0deg);}
			to{transform:rotate(360deg);}
		}
		.d1{
			animation:spin 3s infinite linear; /*gira infinite*/
		}
		.b1:hover{
			animation:spin 3s ;
		}
		@keyframes pulse{
			0%{
				transform:scale(1);
				opacity:1;
			}
			50%{
				transform:scale(1.2);
				opacity:1;
			}
		}
		.d2{
			animation:pulse 2s infinite; /*gira infinite*/
		}
		.b2:hover{
			animation:pulse 2s;
		}

	</style>
</head>
<body link="blue" alink="green" vlink="red">
	<header class="" style=";">
		<div class="container">
			<h1 class="">Well come. Bem-vindo</h1>
		</div>
	</header>
	<main class="container">
		<div class="d1" style="background-color:gray;">div1</div>
		<hr/>
		<button class="b1" style="background-color:blue;">click1</button>
		<hr/>
		<div class="d2" style="background-color:gray;">div2</div>
		<hr/>
		<button class="b2" style="background-color:blue;">click2</button>
		<hr/>
	</main>
	<footer class="">
		<div class="container">
			<p>&copy; footer</p>
		</div>
	</footer>
</body>
</html>
